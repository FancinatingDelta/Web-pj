@if (is2D) {
  <label>
    行数
    <input type="number" min="1" max="100" [(ngModel)]="draftRows" />
  </label>
  <label>
    列数
    <input type="number" min="1" max="100" [(ngModel)]="draftCols" />
  </label>
} @else {
  <label>
    列数
    <input type="number" min="1" max="200" [(ngModel)]="draftCols" />
  </label>
}
<button type="button" class="confirm-btn" (click)="onConfirm()">应用网格尺寸</button>
