<div class="login-shell">
  <div class="login-card">
    <div class="card-header">
      <h1 class="card-title">元胞自动机仿真平台</h1>
      <p class="card-subtitle">登录或注册以开始学习</p>
    </div>

    <div class="tabs">
      <button type="button" [class.active]="mode === 'login'" (click)="switchMode('login')">登录</button>
      <button type="button" [class.active]="mode === 'register'" (click)="switchMode('register')">注册</button>
    </div>

    <form (submit)="submit(); $event.preventDefault()">
      <label class="field">
        <span class="field-label">用户名</span>
        <input type="text" [(ngModel)]="username" name="username" maxlength="64" autocomplete="username" placeholder="请输入用户名" />
      </label>
      <label class="field">
        <span class="field-label">密码</span>
        <input type="password" [(ngModel)]="password" name="password" maxlength="64" autocomplete="current-password" placeholder="请输入密码" />
      </label>

      @if (mode === 'register') {
        <label class="field">
          <span class="field-label">确认密码</span>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" maxlength="64" placeholder="请再次输入密码" />
        </label>
      }

      @if (errorMessage) {
        <p class="error">{{ errorMessage }}</p>
      }

      <button type="submit" class="submit-btn" [disabled]="loading">
        {{ loading ? '处理中...' : (mode === 'login' ? '登录' : '注册') }}
      </button>
    </form>

    <a class="back-link" routerLink="/">&larr; 返回首页</a>
  </div>
</div>
