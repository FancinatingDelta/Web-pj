<div class="login-page">
  <div class="card">
    <h1>元胞自动机仿真平台</h1>
    <p class="subtitle">登录或注册以开始学习</p>

    <div class="tabs">
      <button type="button" [class.active]="mode === 'login'" (click)="switchMode('login')">登录</button>
      <button type="button" [class.active]="mode === 'register'" (click)="switchMode('register')">注册</button>
    </div>

    <form (submit)="submit(); $event.preventDefault()">
      <label>
        用户名
        <input type="text" [(ngModel)]="username" name="username" maxlength="64" autocomplete="username" />
      </label>
      <label>
        密码
        <input type="password" [(ngModel)]="password" name="password" maxlength="64" autocomplete="current-password" />
      </label>

      @if (mode === 'register') {
        <label>
          确认密码
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" maxlength="64" />
        </label>
      }

      @if (errorMessage) {
        <p class="error">{{ errorMessage }}</p>
      }

      <button type="submit" class="submit-btn" [disabled]="loading">
        {{ loading ? '处理中...' : (mode === 'login' ? '登录' : '注册') }}
      </button>
    </form>
  </div>
</div>
